<h1>阅读与写作</h1><p class="demo-lead">一个留给文字和想法的空间。</p><p>好的工具，让人专注于正在做的事情。这里用同一篇笔记，展示两种主题下的配色、排版与材质。</p><h2>从阅读开始</h2><p>背景、字形与段落间距，共同决定阅读的感受。切换上方主题，看看你更喜欢哪一种。</p><blockquote><p>文字保持清晰，界面退到合适的位置。</p></blockquote><h2>也留一点空间给想法</h2><ul><li>记下一个还没想明白的问题</li><li>整理今天读过的内容</li><li>把一个小想法做成可以使用的东西</li></ul><p><a href="https://github.com/dingye0604/AbsolutelyGlass" target="_blank" rel="noopener">查看主题源代码 ↗</a></p>
</div></main></div></div></div></div></div></div>
